name: Mercari Watch

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron is UTC and best-effort -
    # busy periods can delay a run by a few minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

permissions:
  contents: write   # needed so the job can commit seen.json back

concurrency:
  group: mercari-watch
  cancel-in-progress: false   # queue runs instead of letting them race each other

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Mercari for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_mercari.py

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen listings [skip ci]"
          git pull --rebase --autostash
          git push
