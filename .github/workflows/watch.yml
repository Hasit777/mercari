name: Mercari Watch

on:
  schedule:
    # Every 15 minutes. GitHub Actions cron is UTC and best-effort -
    # busy periods can delay a run by a few minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" manually to test

concurrency:
  group: mercari-watch
  cancel-in-progress: false   # avoid two runs overlapping while reading/writing state

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Mercari for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python check_mercari.py
